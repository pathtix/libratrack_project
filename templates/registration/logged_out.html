{% extends "base.html" %} {# Inherits the structure from your base.html #}
{% load static tailwind_tags %}

{% block title %}Logged Out - Libratrack{% endblock title %}

{% block content %}
<div class="max-w-lg mx-auto mt-10 p-8 bg-white rounded-lg shadow-md text-center">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Logged Out</h2>
    <p class="text-gray-700 mb-4">You have been successfully logged out.</p>
    <a href="{% url 'login' %}" class="inline-block py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Log In Again
    </a>
</div>
{% endblock content %}
